name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="v$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          fi
          OUT="MedievalVillage-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medieval-village-debug
          path: ${{ steps.apk.outputs.file }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 중세마을 이야기 ${{ steps.apk.outputs.version }}
          body: |
            ## 스마트폰 설치용 APK

            첨부 파일 `${{ steps.apk.outputs.file }}` 를 다운로드한 뒤 폰에 설치하세요.

            ### 설치 방법
            1. 아래 **Assets** 에서 APK 파일을 다운로드
            2. 폰의 **설정 > 보안** 에서 알 수 없는 앱/출처 설치 허용
            3. 다운로드한 APK 를 눌러 설치
            4. 앱 이름: **중세마을 이야기**

            ### 이번 버전 (v0.3.3)
            - 런처 이름: **중세마을 v0.3.3**
            - 오크헤이븐 마을 일러스트
            - 던전: **Kenney Tiny Dungeon** 타일시트 맵 (좌상단 `v0.3.3 Kenney dungeon`)
            - 저장소 Releases 에서 APK 다운로드

            > debug APK 이므로 서명 경고가 뜰 수 있습니다. 개인 테스트용입니다.
          files: ${{ steps.apk.outputs.file }}
          draft: false
          generate_release_notes: true

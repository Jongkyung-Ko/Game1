name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="v$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)"
          fi
          OUT="MedievalVillage-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medieval-village-debug
          path: ${{ steps.apk.outputs.file }}

      - name: Pack hero class sprites
        id: sprites
        run: |
          VERSION="${{ steps.apk.outputs.version }}"
          PACK="HeroClassSprites-${VERSION}.zip"
          if [[ -f export/HeroClassSprites.zip ]]; then
            cp export/HeroClassSprites.zip "$PACK"
          else
            python3 scripts/pack-hero-sprites.py
            cp export/HeroClassSprites.zip "$PACK"
          fi
          echo "file=$PACK" >> "$GITHUB_OUTPUT"
          ls -lh "$PACK"

      - name: Upload sprite pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: hero-class-sprites
          path: ${{ steps.sprites.outputs.file }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 중세마을 이야기 ${{ steps.apk.outputs.version }}
          body: |
            ## 스마트폰 설치용 APK

            첨부 파일 `${{ steps.apk.outputs.file }}` 를 다운로드한 뒤 폰에 설치하세요.

            ### 설치 방법
            1. 아래 **Assets** 에서 APK 파일을 다운로드
            2. 폰의 **설정 > 보안** 에서 알 수 없는 앱/출처 설치 허용
            3. 다운로드한 APK 를 눌러 설치
            4. 앱 이름: **중세마을 ${{ steps.apk.outputs.version }}**

            ## 직업 스프라이트 팩 (다른 게임용)

            한 번에 받기: `${{ steps.sprites.outputs.file }}`

            기사·용사·마법사·궁수 시작 직업과 전직(수호기사·광전사·원소술사·사냥꾼 등) 도안이 들어 있습니다.
            `hires/` 는 1024×1536 원본, `game_175x286/` 는 게임용 투명 PNG 입니다.

            ### 이번 버전 (${{ steps.apk.outputs.version }})
            - 런처 이름: **중세마을 ${{ steps.apk.outputs.version }}**
            - 시작 화면: 영문 MEDIEVAL VILLAGE 로고 → 시작하기(직업 선택) / 이어하기(세이브)
            - 던전·숲·사막·빙하 지도 (+) 확대 플레이. 타일과 캐릭터가 커진 채로 주인공을 따라감
            - 주인공 크기 1.28배
            - 스킬마다 다른 화려한 특수효과. 용사·기사 특수 근접 범위 확대
            - 던전에서 세계지도는 볼 수 있으나 다른 마을로 이동 불가
            - 포털스톤 워프가 집과 탐험 지점을 잇고, 떠나도 사라지지 않음
            - 레벨업 시 스킬맵이 바로 열리지 않음. Status에서 연다
            - 궁수 스킬 아이콘 추가, 스킬맵 창을 한 화면에 맞춤
            - 마을별 난이도·적정 레벨에 맞춘 몬스터 공격/체력/방어
            - System → 디버그 모드에서 마을 밸런스 표 확인
            - 마법사 기본 마력탄은 MP 없음. 배운 마법·특별스킬만 마나 + 다른 미사일·효과음
            - 걷기·공격 모션 (기사/용사/마법사/궁수, 전직 룩 포함)
            - 시작 시 직업 선택 (기사 / 용사 / 마법사 / 궁수)
            - 레벨 5 / 10 / 15 전직, 레벨 20 각성. 전직마다 성장량 3배
            - 정착지마다 배경음악이 다름. 저주받은 마을·성과 해방된 곳은 다른 곡
            - 이글루 마을 · 바닷가 폐허 · 겨울성
            - 시스템 설정에서 배경음악·효과음 크기 조절
            - 저장소: https://github.com/Jongkyung-Ko/Game1/releases

            > debug APK 이므로 서명 경고가 뜰 수 있습니다. 개인 테스트용입니다.
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.sprites.outputs.file }}
          draft: false
          generate_release_notes: true

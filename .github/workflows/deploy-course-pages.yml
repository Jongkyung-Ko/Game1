name: Deploy Course to GitHub Pages

on:
  push:
    branches: ["cursor/sw-vibe-coding-course-a5d8", "main"]
    paths:
      - "course/**"
      - ".github/workflows/deploy-course-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-course
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: course
      - id: deployment
        uses: actions/deploy-pages@v4
